<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Scholarship Desk</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f7;--s:#fff;--s2:#f7f8fa;--ink:#18202c;--mu:#667085;--ln:#e3e6ec;--ac:#2f4bdb;--acs:#e8ecff;--red:#d92d20;--grn:#12805c;--amb:#b54708;
--c-Researching:#7b8597;--c-Preparing:#b7791f;--c-Submitted:#2f4bdb;--c-Interview:#8a3ffc;--c-Accepted:#12805c;--c-Waitlisted:#0e7490;--c-Rejected:#d92d20;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme=dark]{--bg:#0f131a;--s:#171c25;--s2:#1c222d;--ink:#e8ebf1;--mu:#98a1b3;--ln:#2a3140;--ac:#8aa0ff;--acs:#222a4d;--red:#f2776d;--grn:#3fbf94;--amb:#e0a93b;
--c-Researching:#98a1b3;--c-Preparing:#e0a93b;--c-Submitted:#8aa0ff;--c-Interview:#b78bff;--c-Accepted:#3fbf94;--c-Waitlisted:#38bdd8;--c-Rejected:#f2776d}
*,*:before,*:after{box-sizing:border-box}
html,body{margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Figtree,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);padding:14px 20px 10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:19px;letter-spacing:-.01em;margin-right:auto}
.brand small{display:block;font-weight:400;font-size:12.5px;color:var(--mu);letter-spacing:0}
.in,.sel{background:var(--s);border:1px solid var(--ln);border-radius:9px;padding:8px 11px;min-height:38px}
.in:focus,.sel:focus{outline:2px solid var(--ac);border-color:transparent}
#q{width:260px;max-width:100%}
.btn{border:1px solid var(--ln);background:var(--s);border-radius:9px;padding:8px 13px;min-height:38px;font-weight:500}
.btn:hover{background:var(--s2)}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}.btn.p:hover{filter:brightness(1.08)}
[data-theme=dark] .btn.p{color:#0f131a}
.btn.d{color:var(--red)}
.tabs{display:flex;gap:2px;background:var(--s);border:1px solid var(--ln);border-radius:10px;padding:3px}
.tab{border:0;background:none;padding:6px 13px;border-radius:7px;color:var(--mu);font-weight:500}
.tab[aria-selected=true]{background:var(--ac);color:#fff}
[data-theme=dark] .tab[aria-selected=true]{color:#0f131a}
.filters{margin-top:10px}
.filters .sel{padding:6px 9px;min-height:34px;font-size:14px}
main{padding:20px;max-width:1280px;margin:auto}
.card{background:var(--s);border:1px solid var(--ln);border-radius:12px;padding:16px}
h2{font-size:15px;margin:0 0 12px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat b{display:block;font-size:30px;line-height:1.1;letter-spacing:-.02em}.stat span{color:var(--mu);font-size:13.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bar{display:grid;grid-template-columns:96px 1fr 28px;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--c);min-width:4px}
.bar span:last-child{text-align:right;color:var(--mu)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:600;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);white-space:nowrap}
.up{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--ln);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.up:first-of-type{border-top:0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.grow{flex:1;min-width:0}.grow>div:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mu{color:var(--mu);font-size:13px}
.empty{padding:36px 16px;text-align:center;color:var(--mu)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:250px;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--s2);border:1px solid var(--ln);border-radius:12px;padding:10px;min-height:140px}
.col.over{outline:2px dashed var(--ac)}
.col h3{margin:2px 4px 10px;font-size:14px;display:flex;gap:8px;align-items:center}
.col h3 em{font-style:normal;color:var(--mu);margin-left:auto;font-weight:400}
.k{background:var(--s);border:1px solid var(--ln);border-radius:10px;padding:11px;margin-bottom:8px;cursor:grab;display:block;width:100%;text-align:left}
.k:hover{border-color:var(--ac)}.k b{display:block;margin-bottom:2px}
.pr{height:5px;border-radius:3px;background:var(--ln);margin-top:9px;overflow:hidden}.pr i{display:block;height:100%;background:var(--grn)}
.u{font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--s2);color:var(--mu);white-space:nowrap}
.u.r{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}.u.a{background:color-mix(in srgb,var(--amb) 15%,transparent);color:var(--amb)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--ln);font-size:14px}
th{font-weight:600;color:var(--mu);cursor:pointer;white-space:nowrap;user-select:none}th:hover{color:var(--ink)}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--s2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--ln);border-left:1px solid var(--ln)}
.cal>div{border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);min-height:100px;padding:5px;min-width:0}
.cal .h{min-height:0;text-align:center;color:var(--mu);font-size:13px;font-weight:600;padding:7px 0}
.cal .d{cursor:pointer}.cal .d:hover{background:var(--s2)}.cal .d.o{opacity:.45}.cal .d.sel{background:var(--acs)}
.cal .n{font-size:13px;display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:12px;margin-bottom:3px}
.cal .t .n{background:var(--ac);color:#fff;font-weight:700}[data-theme=dark] .cal .t .n{color:#0f131a}
.ev{display:block;font-size:12px;line-height:1.3;padding:2px 6px;margin-bottom:2px;border-radius:5px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.ev.late{--c:var(--red)}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}.leg span{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mu)}
.grp{margin-bottom:18px}.grp h2 span{color:var(--mu);font-weight:400}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--s);border-left:1px solid var(--ln);z-index:20;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(0,0,0,.12)}
#panel.open{transform:none}
#veil{position:fixed;inset:0;background:rgba(10,14,22,.35);z-index:19;display:none}#veil.on{display:block}
.ph{padding:16px 20px;border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:17px}
.pb{padding:18px 20px;overflow-y:auto;flex:1}
.pf{padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln);display:flex;gap:8px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fg .w{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--mu);font-weight:500}label .in,label .sel,label textarea{width:100%;margin-top:4px;color:var(--ink)}
.ck{display:flex;gap:9px;align-items:center;padding:6px 0}.ck input{width:18px;height:18px;accent-color:var(--ac)}.ck button{margin-left:auto;border:0;background:none;color:var(--mu)}
.err{color:var(--red);font-size:13px;margin-top:4px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;display:none;gap:14px;align-items:center}
#toast.on{display:flex}#toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline}
details{position:relative}summary{list-style:none}summary::-webkit-details-marker{display:none}
.menu{position:absolute;right:0;top:44px;background:var(--s);border:1px solid var(--ln);border-radius:10px;padding:6px;min-width:190px;z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.menu button,.menu label{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;color:var(--ink);font-size:14px}.menu button:hover{background:var(--s2)}
@media(max-width:760px){.grid2{grid-template-columns:1fr}.cal>div{min-height:64px}.ev{font-size:0;height:6px;padding:0;border-left:0;background:var(--c)}main{padding:14px}header{padding:12px 14px 8px}.fg{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){#panel{transition:none}}
</style></head><body>
<header>
 <div class="row">
  <div class="brand">Scholarship Desk<small id="sub"></small></div>
  <input id="q" class="in" type="search" placeholder="Search scholarships (press /)" aria-label="Search">
  <details id="more"><summary class="btn">Data</summary><div class="menu">
   <button data-a="json">Export JSON</button><button data-a="csv">Export CSV</button>
   <label style="cursor:pointer">Import JSON<input id="imp" type="file" accept=".json" hidden></label>
   <button data-a="clear">Clear all data</button><button data-a="sample">Load sample data</button></div></details>
  <button class="btn" id="theme" aria-label="Toggle dark mode">Dark mode</button>
  <button class="btn p" data-a="new">Add scholarship</button>
 </div>
 <div class="row filters">
  <div class="tabs" role="tablist" id="tabs"></div>
  <select class="sel" id="fs" aria-label="Status"></select><select class="sel" id="fc" aria-label="Country"></select>
  <select class="sel" id="fp" aria-label="Priority"></select><select class="sel" id="ff" aria-label="Funding"></select>
  <button class="btn" data-a="reset" style="min-height:34px;padding:5px 11px">Reset filters</button>
 </div>
</header>
<main id="main"></main>
<div id="veil"></div><aside id="panel" aria-label="Scholarship details"></aside><div id="toast" role="status"></div>
<script>
const K='scholarship-desk-v1',$=s=>document.querySelector(s);
const T0=new Date();T0.setHours(0,0,0,0);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const off=n=>{const d=new Date(T0);d.setDate(d.getDate()+n);return ymd(d)};
const dd=s=>s?Math.round((new Date(s+'T00:00')-T0)/864e5):null;
const fmt=s=>s?new Date(s+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'No date';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST=['Researching','Preparing','Submitted','Interview','Accepted','Waitlisted','Rejected'],OPEN=['Researching','Preparing'],ACT=['Researching','Preparing','Submitted','Interview'];
const REQ=['CV','Statement of purpose','Transcripts','Recommendation letters','English proof (IELTS)','Passport copy'];
const EV={deadline:['Deadline','--ac'],rec:['Recommendations due','--amb'],interview:['Interview','--c-Interview'],result:['Result date','--grn']};
const mk=(name,org,country,field,funding,amount,status,priority,dl,done,x={})=>({id:uid(),name,org,country,field,level:'MSc',funding,amount,status,priority,deadline:off(dl),rec:'',interview:'',result:'',reqs:REQ.map((t,i)=>({t,d:i<done})),notes:'Sample entry. Confirm dates on the official site.',link:'',contact:'',added:off(-20),updated:off(-2),...x});
const SAMPLE=()=>[
 mk('Stipendium Hungaricum','Tempus Public Foundation','Hungary','Robotics and control','Full','Tuition + monthly stipend','Preparing','High',12,3,{rec:off(6)}),
 mk('Korean Government Scholarship (GKS)','NIIED','South Korea','Robotics / EE','Full','Tuition + stipend + airfare','Preparing','High',20,2),
 mk('DAAD Study Scholarship','DAAD','Germany','Control systems','Partial','Monthly stipend','Researching','High',45,0),
 mk('Chinese Government Scholarship','CSC','China','Robotics','Full','Tuition + housing + stipend','Researching','Medium',60,0),
 mk('Türkiye Scholarships','YTB','Türkiye','Electrical engineering','Full','Tuition + stipend','Submitted','Medium',-10,6,{result:off(25)}),
 mk('Erasmus Mundus Joint Masters','European Union','Europe','Advanced robotics','Full','Tuition + travel + living','Researching','High',90,0),
 mk('Swedish Institute Scholarship','Swedish Institute','Sweden','Electrical engineering','Full','Tuition + living costs','Interview','Medium',-25,6,{interview:off(4)}),
 mk('MEXT Embassy Recommended','MEXT','Japan','Robotics','Full','Tuition + monthly allowance','Researching','Low',30,1)];
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!Array.isArray(S.items))S={items:SAMPLE(),theme:null};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let V='overview',F={q:'',status:'',country:'',priority:'',funding:''},sort={k:'deadline',dir:1},cal=new Date(T0.getFullYear(),T0.getMonth(),1),selDay=null,cols={org:1,country:1,funding:1,priority:1,progress:1},cur=null,tmp=[],undo=null,tt;
const prog=s=>s.reqs.length?Math.round(100*s.reqs.filter(r=>r.d).length/s.reqs.length):0;
const list=()=>{const q=F.q.toLowerCase();return S.items.filter(s=>(!q||[s.name,s.org,s.country,s.field,s.notes].join(' ').toLowerCase().includes(q))&&(!F.status||s.status==F.status)&&(!F.country||s.country==F.country)&&(!F.priority||s.priority==F.priority)&&(!F.funding||s.funding==F.funding))};
const events=l=>l.flatMap(s=>Object.keys(EV).filter(k=>s[k]&&(k!='deadline'||OPEN.includes(s.status)||true)).map(k=>({k,date:s[k],s})));
const urg=s=>{const n=dd(s.deadline);if(n===null)return'';if(!OPEN.includes(s.status))return`<span class="u">${fmt(s.deadline)}</span>`;
 if(n<0)return`<span class="u r">Overdue ${-n}d</span>`;if(n==0)return'<span class="u r">Due today</span>';
 return`<span class="u ${n<=3?'r':n<=14?'a':''}">${n} day${n>1?'s':''} left</span>`};
const chip=s=>`<span class="chip" style="--c:var(--c-${s})">${s}</span>`;
const toast=(m,u)=>{const t=$('#toast');t.innerHTML=esc(m)+(u?'<button data-a="undo">Undo</button>':'');t.className='on';clearTimeout(tt);tt=setTimeout(()=>t.className='',u?7000:2500)};

function vOverview(l){
 const act=l.filter(s=>ACT.includes(s.status)),due=l.filter(s=>OPEN.includes(s.status)&&dd(s.deadline)>=0&&dd(s.deadline)<=14);
 const c=[['Total',l.length],['In progress',act.length],['Due in 14 days',due.length],['Submitted',l.filter(s=>s.status=='Submitted').length],['Accepted',l.filter(s=>s.status=='Accepted').length]];
 const mx=Math.max(1,...ST.map(t=>l.filter(s=>s.status==t).length));
 const up=events(l).filter(e=>dd(e.date)>=0&&(e.k!='deadline'||OPEN.includes(e.s.status))).sort((a,b)=>a.date<b.date?-1:1).slice(0,7);
 return`<div class="stats">${c.map(x=>`<div class="card stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div>
 <div class="grid2"><div class="card"><h2>Pipeline</h2>${ST.map(t=>{const n=l.filter(s=>s.status==t).length;return`<div class="bar"><span>${t}</span><span><i style="--c:var(--c-${t});width:${n/mx*100}%"></i></span><span>${n}</span></div>`}).join('')}</div>
 <div class="card"><h2>Up next</h2>${up.length?up.map(e=>{const n=dd(e.date);return`<button class="up" data-open="${e.s.id}"><span class="dot" style="--c:var(${EV[e.k][1]})"></span><span class="grow"><div>${esc(e.s.name)}</div><div class="mu">${EV[e.k][0]} · ${fmt(e.date)}</div></span><span class="u ${n<=3?'r':n<=14?'a':''}">${n==0?'Today':n+'d'}</span></button>`}).join(''):'<div class="empty">Nothing coming up. Add a deadline to see it here.</div>'}</div></div>`}

function vBoard(l){return`<div class="board">${ST.map(t=>{const c=l.filter(s=>s.status==t);return`<div class="col" data-col="${t}"><h3><span class="dot" style="--c:var(--c-${t})"></span>${t}<em>${c.length}</em></h3>${c.map(s=>`<button class="k" draggable="true" data-id="${s.id}" data-open="${s.id}"><b>${esc(s.name)}</b><span class="mu">${esc(s.country)} · ${s.priority}</span><div style="margin-top:8px">${urg(s)}</div><div class="pr"><i style="width:${prog(s)}%"></i></div></button>`).join('')||'<div class="mu" style="padding:8px">Drop a card here</div>'}</div>`}).join('')}</div>`}

function vTable(l){
 const C=[['name','Scholarship',1],['org','Provider'],['country','Country'],['funding','Funding'],['priority','Priority'],['status','Status',1],['deadline','Deadline',1],['progress','Progress']];
 const sc=C.filter(c=>c[2]||cols[c[0]]);
 const val=s=>sort.k=='progress'?prog(s):(s[sort.k]||'');
 const r=[...l].sort((a,b)=>(val(a)>val(b)?1:val(a)<val(b)?-1:0)*sort.dir);
 const cell=(k,s)=>({name:`<b>${esc(s.name)}</b>`,org:esc(s.org),country:esc(s.country),funding:esc(s.funding),priority:s.priority,status:chip(s.status),deadline:urg(s),progress:`<div class="pr" style="width:90px"><i style="width:${prog(s)}%"></i></div>`})[k];
 return`<div class="card"><div class="row" style="margin-bottom:10px"><span class="mu">${r.length} scholarship${r.length==1?'':'s'}</span><details style="margin-left:auto"><summary class="btn">Columns</summary><div class="menu">${C.filter(c=>!c[2]).map(c=>`<label><input type="checkbox" data-col="${c[0]}" ${cols[c[0]]?'checked':''}> ${c[1]}</label>`).join('')}</div></details></div>
 <div class="tw"><table><thead><tr>${sc.map(c=>`<th data-sort="${c[0]}">${c[1]}${sort.k==c[0]?(sort.dir>0?' ↑':' ↓'):''}</th>`).join('')}</tr></thead><tbody>${r.map(s=>`<tr data-open="${s.id}" tabindex="0">${sc.map(c=>`<td>${cell(c[0],s)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`}

function vCal(l){
 const y=cal.getFullYear(),m=cal.getMonth(),pad=(new Date(y,m,1).getDay()+6)%7,st=new Date(y,m,1-pad),ev={};
 events(l).forEach(e=>(ev[e.date]=ev[e.date]||[]).push(e));
 let cells='';['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(d=>cells+=`<div class="h">${d}</div>`);
 for(let i=0;i<42;i++){const d=new Date(st);d.setDate(st.getDate()+i);const k=ymd(d),e=ev[k]||[];
  cells+=`<div class="d ${d.getMonth()!=m?'o':''} ${k==off(0)?'t':''} ${k==selDay?'sel':''}" data-day="${k}"><span class="n">${d.getDate()}</span>${e.slice(0,3).map(x=>`<span class="ev ${x.k=='deadline'&&dd(k)<0&&OPEN.includes(x.s.status)?'late':''}" style="--c:var(${EV[x.k][1]})" title="${esc(x.s.name)}">${esc(x.s.name)}</span>`).join('')}${e.length>3?`<span class="mu">+${e.length-3} more</span>`:''}</div>`}
 const sd=selDay&&ev[selDay]||[];
 return`<div class="card"><div class="row" style="margin-bottom:12px"><h2 style="margin:0;font-size:18px;min-width:150px">${cal.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</h2>
 <button class="btn" data-a="prev" aria-label="Previous month">‹</button><button class="btn" data-a="today">Today</button><button class="btn" data-a="next" aria-label="Next month">›</button></div>
 <div class="cal">${cells}</div><div class="leg">${Object.values(EV).map(v=>`<span><i class="dot" style="--c:var(${v[1]})"></i>${v[0]}</span>`).join('')}<span><i class="dot" style="--c:var(--red)"></i>Overdue</span></div>
 ${selDay?`<h2 style="margin-top:18px">${fmt(selDay)}</h2>${sd.length?sd.map(e=>`<button class="up" data-open="${e.s.id}"><span class="dot" style="--c:var(${EV[e.k][1]})"></span><span class="grow"><div>${esc(e.s.name)}</div><div class="mu">${EV[e.k][0]}</div></span>${chip(e.s.status)}</button>`).join(''):'<div class="mu">Nothing on this day.</div><button class="btn" style="margin-top:8px" data-a="newday">Add a scholarship with this deadline</button>'}`:''}</div>`}

function vTime(l){
 const e=events(l).filter(x=>x.k!='deadline'||OPEN.includes(x.s.status)||dd(x.date)>=0).sort((a,b)=>a.date<b.date?-1:1);
 const G=[['Overdue',x=>dd(x.date)<0],['This week',x=>dd(x.date)>=0&&dd(x.date)<=7],['This month',x=>dd(x.date)>7&&dd(x.date)<=31],['Later',x=>dd(x.date)>31]];
 const out=G.map(([n,f])=>{const g=e.filter(f);return g.length?`<div class="grp card"><h2>${n} <span>${g.length}</span></h2>${g.map(x=>`<button class="up" data-open="${x.s.id}"><span class="dot" style="--c:var(${EV[x.k][1]})"></span><span class="grow"><div>${esc(x.s.name)}</div><div class="mu">${EV[x.k][0]} · ${fmt(x.date)}</div></span>${chip(x.s.status)}</button>`).join('')}</div>`:''}).join('');
 return out||'<div class="card empty">No dates yet. Add a deadline to a scholarship and it will show up here.</div>'}

function render(){
 const l=list();
 $('#sub').textContent=`${S.items.length} tracked · ${S.items.filter(s=>OPEN.includes(s.status)&&dd(s.deadline)>=0&&dd(s.deadline)<=14).length} due soon`;
 $('#tabs').innerHTML=[['overview','Overview'],['board','Board'],['table','Table'],['calendar','Calendar'],['timeline','Timeline']].map(t=>`<button class="tab" role="tab" data-v="${t[0]}" aria-selected="${V==t[0]}">${t[1]}</button>`).join('');
 const opt=(id,label,arr,v)=>$(id).innerHTML=`<option value="">${label}</option>`+[...new Set(arr)].filter(Boolean).sort().map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('');
 opt('#fs','All statuses',ST,F.status);opt('#fc','All countries',S.items.map(s=>s.country),F.country);opt('#fp','All priorities',['High','Medium','Low'],F.priority);opt('#ff','All funding',S.items.map(s=>s.funding),F.funding);
 $('#theme').textContent=document.documentElement.dataset.theme=='dark'?'Light mode':'Dark mode';
 if(!S.items.length){$('#main').innerHTML='<div class="card empty"><h2>No scholarships yet</h2>Add your first one to start tracking deadlines and requirements.<div style="margin-top:14px"><button class="btn p" data-a="new">Add scholarship</button> <button class="btn" data-a="sample">Load sample data</button></div></div>';return}
 if(!l.length&&V!='calendar'){$('#main').innerHTML='<div class="card empty">No scholarships match these filters.<div style="margin-top:12px"><button class="btn" data-a="reset">Reset filters</button></div></div>';return}
 $('#main').innerHTML={overview:vOverview,board:vBoard,table:vTable,calendar:vCal,timeline:vTime}[V](l)}

function openForm(id,dl){
 const s=id?S.items.find(x=>x.id==id):{name:'',org:'',country:'',field:'',level:'MSc',funding:'Full',amount:'',status:'Researching',priority:'Medium',deadline:dl||'',rec:'',interview:'',result:'',reqs:REQ.map(t=>({t,d:false})),notes:'',link:'',contact:''};
 cur=id||null;tmp=s.reqs.map(r=>({...r}));
 const f=(n,l,t='text',w='')=>`<label class="${w}">${l}<input class="in" name="${n}" type="${t}" value="${esc(s[n])}"></label>`;
 const sel=(n,l,a)=>`<label>${l}<select class="sel" name="${n}">${a.map(x=>`<option ${x==s[n]?'selected':''}>${x}</option>`).join('')}</select></label>`;
 $('#panel').innerHTML=`<div class="ph"><span>${id?'Edit scholarship':'Add scholarship'}</span><button class="btn" data-a="close" aria-label="Close">Close</button></div>
 <form id="fm" class="pb" novalidate><div class="fg">${f('name','Name *','text','w')}<div class="err w" id="e1" hidden>Enter a scholarship name.</div>${f('org','Provider')}${f('country','Country')}${f('field','Program or field','text','w')}
 ${sel('level','Degree level',['BSc','MSc','PhD','Other'])}${sel('funding','Funding',['Full','Partial','Stipend only','None'])}${f('amount','Funding details','text','w')}
 ${sel('status','Status',ST)}${sel('priority','Priority',['High','Medium','Low'])}${f('deadline','Application deadline','date')}${f('rec','Recommendations due','date')}${f('interview','Interview date','date')}${f('result','Result date','date')}
 ${f('link','Application link','url','w')}${f('contact','Contact person','text','w')}<label class="w">Notes<textarea class="in" name="notes" rows="3">${esc(s.notes)}</textarea></label></div>
 <h2 style="margin-top:20px">Requirements</h2><div id="ckl"></div><div class="row" style="margin-top:8px"><input class="in grow" id="nr" placeholder="Add a requirement"><button type="button" class="btn" data-a="addreq">Add</button></div></form>
 <div class="pf"><button class="btn p" data-a="save">Save changes</button>${id?'<button class="btn d" data-a="del">Delete</button>':''}</div>`;
 ck();$('#panel').classList.add('open');$('#veil').classList.add('on');setTimeout(()=>$('#fm [name=name]').focus(),50)}
const ck=()=>$('#ckl').innerHTML=tmp.map((r,i)=>`<div class="ck"><input type="checkbox" data-ck="${i}" ${r.d?'checked':''} id="r${i}"><label for="r${i}" style="color:var(--ink);font-size:14.5px">${esc(r.t)}</label><button type="button" data-rm="${i}" aria-label="Remove ${esc(r.t)}">✕</button></div>`).join('')||'<div class="mu">No requirements yet.</div>';
const close=()=>{$('#panel').classList.remove('open');$('#veil').classList.remove('on')};

function saveForm(){
 const fm=$('#fm'),d={};[...fm.elements].forEach(e=>{if(e.name)d[e.name]=e.value.trim()});
 if(!d.name){$('#e1').hidden=false;fm.elements.name.focus();return}
 const o=cur?S.items.find(x=>x.id==cur):{id:uid(),added:off(0)};Object.assign(o,d,{reqs:tmp,updated:off(0)});
 if(!cur)S.items.push(o);save();close();render();toast(cur?'Changes saved':'Scholarship added')}

const file=(name,data)=>claude.use('downloads').then(d=>d?d.save({filename:name,data}):toast('Downloads are not available here')).catch(e=>e&&e.code!='declined'&&toast('Could not save the file'));
function csv(){const h=['name','org','country','field','level','funding','amount','status','priority','deadline','rec','interview','result','progress','link','contact','notes'];
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';return[h.join(',')].concat(S.items.map(s=>h.map(k=>q(k=='progress'?prog(s)+'%':s[k])).join(','))).join('\n')}

document.addEventListener('click',e=>{
 const a=e.target.closest('[data-a]'),o=e.target.closest('[data-open]'),v=e.target.closest('[data-v]'),th=e.target.closest('[data-sort]'),dy=e.target.closest('[data-day]');
 if(!e.target.closest('details'))document.querySelectorAll('details[open]').forEach(x=>x.open=false);
 if(e.target.id=='veil')return close();
 if(v){V=v.dataset.v;return render()}
 if(th){sort=sort.k==th.dataset.sort?{k:sort.k,dir:-sort.dir}:{k:th.dataset.sort,dir:1};return render()}
 if(e.target.dataset.rm!==undefined){tmp.splice(+e.target.dataset.rm,1);return ck()}
 if(a){const x=a.dataset.a;
  if(x=='new')openForm();else if(x=='newday')openForm(null,selDay);else if(x=='close')close();else if(x=='save')saveForm();
  else if(x=='reset'){F={q:'',status:'',country:'',priority:'',funding:''};$('#q').value='';render()}
  else if(x=='prev'){cal.setMonth(cal.getMonth()-1);render()}else if(x=='next'){cal.setMonth(cal.getMonth()+1);render()}
  else if(x=='today'){cal=new Date(T0.getFullYear(),T0.getMonth(),1);selDay=off(0);render()}
  else if(x=='addreq'){const i=$('#nr');if(i.value.trim()){tmp.push({t:i.value.trim(),d:false});i.value='';ck()}}
  else if(x=='del'){const i=S.items.findIndex(s=>s.id==cur);undo=S.items.splice(i,1)[0];save();close();render();toast('Scholarship deleted',1)}
  else if(x=='undo'&&undo){S.items.push(undo);undo=null;save();render();toast('Restored')}
  else if(x=='json')file('scholarships.json',JSON.stringify(S.items,null,2));else if(x=='csv')file('scholarships.csv',csv());
  else if(x=='clear'){if(confirm('Delete all scholarships? This cannot be undone.')){S.items=[];save();render()}}
  else if(x=='sample'){S.items=S.items.concat(SAMPLE());save();render()}
  return}
 if(o&&!e.target.closest('input,details'))return openForm(o.dataset.open);
 if(dy&&V=='calendar'){selDay=dy.dataset.day;render()}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.ck!==undefined)tmp[+t.dataset.ck].d=t.checked;
 if(t.dataset.col){cols[t.dataset.col]=t.checked?1:0;render();document.querySelector('details .menu')&&(document.querySelectorAll('details')[1]||{}).setAttribute?.('open','')}
 if(t.id=='fs'){F.status=t.value;render()}if(t.id=='fc'){F.country=t.value;render()}if(t.id=='fp'){F.priority=t.value;render()}if(t.id=='ff'){F.funding=t.value;render()}
 if(t.id=='imp'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j))throw 0;S.items=j.map(s=>({...s,id:s.id||uid(),reqs:s.reqs||[]}));save();render();toast('Imported '+j.length+' scholarships')}catch(x){toast('That file is not a valid export')}};r.readAsText(t.files[0]);t.value=''}});
$('#q').addEventListener('input',e=>{F.q=e.target.value;render()});
document.addEventListener('keydown',e=>{const t=e.target,typing=/INPUT|TEXTAREA|SELECT/.test(t.tagName);
 if(e.key=='Escape')close();
 else if(e.key=='Enter'&&t.id=='nr'){e.preventDefault();document.querySelector('[data-a=addreq]').click()}
 else if(e.key=='Enter'&&t.matches('tr[data-open]'))openForm(t.dataset.open);
 else if(!typing&&e.key=='/'){e.preventDefault();$('#q').focus()}
 else if(!typing&&e.key.toLowerCase()=='n'&&!e.metaKey&&!e.ctrlKey){e.preventDefault();openForm()}});
document.addEventListener('dragstart',e=>{const k=e.target.closest&&e.target.closest('[data-id]');if(k)e.dataTransfer.setData('text/plain',k.dataset.id)});
document.addEventListener('dragover',e=>{const c=e.target.closest('[data-col]');if(c){e.preventDefault();c.classList.add('over')}});
document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('[data-col]');if(c)c.classList.remove('over')});
document.addEventListener('drop',e=>{const c=e.target.closest('[data-col]');if(!c)return;e.preventDefault();const s=S.items.find(x=>x.id==e.dataTransfer.getData('text/plain'));
 if(s&&s.status!=c.dataset.col){s.status=c.dataset.col;s.updated=off(0);save();render();toast('Moved to '+s.status)}});
$('#theme').onclick=()=>{S.theme=document.documentElement.dataset.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=S.theme;save();render()};
document.documentElement.dataset.theme=S.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
render();
</script></body></html>
